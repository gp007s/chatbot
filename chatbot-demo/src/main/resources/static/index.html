<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sample Store — Chatbot Demo</title>
    <link rel="stylesheet" href="/widget.css">
    <style>
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            max-width: 640px;
            margin: 64px auto;
            padding: 0 24px;
            color: #1c1c1c;
            line-height: 1.55;
        }
        h1 { font-size: 28px; margin-bottom: 8px; }
        p { color: #444; }
        #chat-with-us {
            display: inline-block;
            margin-top: 24px;
            padding: 10px 18px;
            background: #1c1c1c;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
        #chat-with-us:hover { background: #333; }
    </style>
</head>
<body>
    <h1>Welcome to the sample store</h1>
    <p>
        This page stands in for any customer-facing page on your site.
        The link below is what a customer clicks to open the chatbot -
        it can live in your header, your footer, or a product page.
    </p>

    <!-- This is the link the task describes: clicking it opens the chatbot. -->
    <a href="#" id="chat-with-us">Chat with us</a>

    <!-- Loads the floating widget. It stays hidden until #chat-with-us is clicked. -->
    <script src="/widget.js"></script>
</body>
</html>
