server:
  port: 8080

spring:
  application:
    name: chatbot-demo

# --- Chat provider settings -------------------------------------------------
# No API key needed - Ollama runs locally and this just calls it over HTTP.
# Make sure `ollama serve` is running and the model below has been pulled
# (see README.md) before you start this app.
chatbot:
  provider:
    base-url: http://localhost:11434/api/chat
    model: llama3.2
    max-response-tokens: 512
    # This is what scopes the bot to ONLY application-status inquiries.
    # It's the main lever to adjust if the bot strays off-topic - tighten
    # the wording, add more explicit "refuse to discuss X" examples, etc.
    system-prompt: >
      You are an automated assistant that ONLY helps customers check the
      status of their application using their PCN (a primary reference
      number). The customer has already been identity-verified before this
      conversation started, so do not ask for name, address, or date of
      birth again. You must not help with anything else.

      Rules:
      - You cannot look up or state any application status until the
        customer gives you their PCN. If they haven't given it yet, say so
        plainly and ask for it - do not answer any other question first,
        and do not guess or imply a status.
      - If a status lookup result appears in this conversation, use it to
        answer - never guess or invent a status.
      - If the customer asks about anything unrelated to their application
        status (general questions, other products, small talk beyond a
        greeting, or anything else), politely say you can only help with
        application status here, and ask for their PCN.
      - Keep every reply short: 1-3 sentences.

  # --- Identity verification (runs BEFORE the model does normal chat) ----
  # Conversational collection: the model gathers these fields naturally
  # (any order, multiple per message), but the CODE - not the model -
  # decides when every field is filled and makes the real SecurityCheckApi
  # call (see ChatController.handleVerificationStep). max-turns is a
  # safety cap: if verification drags on past this many exchanges without
  # completing, the session fails closed rather than loop forever.
  # Add/remove a field by editing the `fields` list only.
  verification:
    enabled: true
    max-turns: 8
    opening-prompt: >
      Before we get started, I need to verify a few details with you.
      Could you tell me your full name, current address, and date of birth?
    system-prompt: >
      You are a friendly identity-verification assistant. Your only job
      right now is to collect the customer's full name, current address,
      and date of birth, in a natural, conversational way. They may give
      you several of these at once, in any order, or one at a time -
      follow their lead. Whenever they state any of this information,
      call the record_customer_info tool with exactly what they said - do
      not guess, infer, or invent a value they did not give you. If they
      ask an unrelated question, answer briefly if you can, then gently
      steer back to collecting whatever is still missing.

      Until every field has been provided, always end your reply by
      explicitly naming which specific piece(s) of information are still
      needed - for example, "I still need your address and date of
      birth." Never ask generically ("could you provide the rest?")
      without naming them, and never say verification is complete unless
      you have genuinely been given all three. Keep every reply short:
      1-2 sentences.
    fields:
      - key: fullName
        label: full name
      - key: address
        label: current address
      - key: dateOfBirth
        label: date of birth (MM/DD/YYYY)

  # --- PCN detection -----------------------------------------------------
  # Used to spot a PCN in the customer's raw message and call the status
  # API immediately, without waiting on the model. PLACEHOLDER PATTERN:
  # matches a generic 6-15 char alphanumeric token. Replace with a regex
  # matching your real PCN format (fixed length, a specific prefix, etc.)
  # for reliable, false-positive-free detection. See PcnExtractor.java.
  pcn:
    pattern: "\\b(?=[A-Za-z0-9]*\\d)[A-Za-z0-9]{6,15}\\b"

  # --- Backend API integrations -------------------------------------------
  # Replace these base URLs with your real services. See
  # SecurityCheckApiClient, ApplicationStatusApiClient, and
  # ApplicationUpdateApiClient (src/main/java/.../service/) for the exact
  # request/response shape each one assumes - adjust those classes if your
  # real APIs differ. All three point at the dummy-apis project (see the
  # top-level README) running on port 9001 - swap in your real hosts later.
  tools:
    security-check-api:
      # POST {base-url} -> { verified, reason }. Called once, after every
      # verification field has been collected.
      base-url: http://localhost:9001/api/security-check
    application-status-api:
      # GET {base-url}/{pcn} -> application status JSON (statusCode, not a
      # message). Called directly as soon as a PCN is detected in a
      # message (see ChatController), and also available to the model as
      # a tool fallback.
      base-url: http://localhost:9001/api/applications
    application-update-api:
      # POST {base-url} -> receives the end-of-chat summary. Called once,
      # when the customer ends the chat.
      base-url: http://localhost:9001/api/application-updates

  # Origins allowed to call this backend from the browser widget.
  # Comma-separated on purpose: it lets @Value bind it straight to a String[].
  cors:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080
