# Maps the raw status codes returned by ApplicationStatusAPI to the exact
# customer-facing message the bot is allowed to say. Only the mapped
# message ever reaches the model or the customer - the code itself never
# leaves ApplicationStatusApiClient / ApplicationStatusTool / ChatController.
#
# Add a line per code your real API can return. UNKNOWN is the fallback
# used when a code has no mapping here (fail-safe: never leak a raw code).
APP100=Your application has been received and is pending initial review.
APP200=Your application is currently under review.
APP300=We need a few more documents from you. Please check your email for details.
APP400=Good news - your application has been approved.
APP500=Your application was not approved at this time. Please contact support for details.
UNKNOWN=We could not determine your application's current status. Please contact support.
